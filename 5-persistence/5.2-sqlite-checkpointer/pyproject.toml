[project]
name = "l5-2-sqlite-checkpointer"
version = "0.1.0"
description = "Lesson 5.2: Durable Checkpoints with SQLite"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.16",
    "langgraph-checkpoint==4.3.0",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langgraph-prebuilt==1.1.1",
    "langchain-core==1.6.12",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
