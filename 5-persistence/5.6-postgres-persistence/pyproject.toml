[project]
name = "l5-6-postgres-persistence"
version = "0.1.0"
description = "Lesson 5.6: Postgres Checkpointer and Store for Production"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.16",
    "langgraph-checkpoint==4.3.0",
    "langchain-core==1.6.12",
    "numpy==2.5.4",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
