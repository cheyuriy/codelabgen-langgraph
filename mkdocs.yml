# Generated by `codelabgen toc`; edits are overwritten.
# Serve locally: ./run.sh site serve
site_name: "LangGraph 1.2 in Practice: From a First Graph to Reliable Agents"
site_description: "Learn LangGraph by running it. This course takes you from your first graph to agents that you can pause, resume, stream and test, with one small working program per lesson."
docs_dir: .
site_dir: site
use_directory_urls: false
strict: true

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: "Switch to dark mode"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: "Switch to light mode"
  features:
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - content.code.copy

plugins:
  - same-dir
  - search
  - callouts

hooks:
  - assets/hooks/asciinema.py

exclude_docs: |
  .*
  site/
  **/.venv/
  **/__pycache__/
  *.lock
  *.toml
  *.yml
  *.yaml
  .env*
  run.sh
  assets/hooks/
  assets/glossary-abbr.md

validation:
  omitted_files: ignore
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      auto_append:
        - assets/glossary-abbr.md

extra_javascript:
  - assets/js/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/asciinema-player@3/dist/bundle/asciinema-player.min.js
  - assets/js/asciinema.js

extra_css:
  - https://cdn.jsdelivr.net/npm/asciinema-player@3/dist/bundle/asciinema-player.css

